<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Ninja - Card Match 🃏</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mali:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/memory_ninja.css') }}">
</head>
<body>
    <header>
        <div class="logo">
            <img src="/static/image/logo.png" class="logo-ninja">
            <span class="logo-title">NINJATSU</span>
        </div>
        <nav>
            <a href="{{ url_for('homepage') }}">Home</a>
            <a href="{{ url_for('explore_games') }}">Play Games</a>
            <a href="{{ url_for('start_learning') }}" class="active">Dojo Camp</a>
            <a href="{{ url_for('rewards') }}">Trophies</a>
        </nav>
    </header>

    <main class="training-main">
        <div class="dojo-arena-box">
            <h1 id="levelTitle">🃏 CARD MATCH - LEVEL 1</h1>
            <p class="subtitle-text">Flip cards and match pairs of ninja items!</p>
            
            <div class="stats-row">
                <span id="movesDisplay">Moves: 0 / 8 ⭐</span>
                <span id="matchesDisplay">Pairs: 0 / 4 🎉</span>
            </div>

            <div id="memoryGrid" class="memory-grid"></div>

            <a href="{{ url_for('start_learning') }}" class="back-btn">⬅ Back to Dojo</a>
        </div>
    </main>

    <div id="completionModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-badge" id="modalBadge">🏆⭐</div>
            <h2 id="modalTitle">AWESOME MATCH! 🎉</h2>
            <p id="finalScoreText">Great memory! You matched all pairs!</p>
            <button id="finishBtn" class="scroll-btn">NEXT LEVEL 🚀</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Ninjatsu Dojo Studio. Play, Learn & Have Fun! 🌟
    </footer>
    <script src="{{ url_for('static', filename='js/ninja_juice.js') }}"></script>
    <script src="{{ url_for('static', filename='js/memory_ninja.js') }}"></script>
</body>
</html>
