<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Ninja - Dojo Training</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/start_learning.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/memory_ninja.css') }}">
</head>
<body>

    <header>
        <div class="logo">🥷 NINJATSU</div>
        <nav>
            <a href="{{ url_for('homepage') }}">Home</a>
            <a href="{{ url_for('explore_games') }}">Explore Games</a>
            <a href="{{ url_for('start_learning') }}" class="active">Start Learning</a>
            <a href="{{ url_for('rewards') }}">Rewards</a>
        </nav>
    </header>

    <main class="training-main">
        <div class="dojo-arena-box">
            <h1 style="color: #064e3b; font-size: 20px;" id="levelTitle">🃏 MEMORY NINJA - LEVEL 1</h1>
            <p style="color: #4b5563; font-size: 12px; margin-bottom: 15px;">Flip the cards and find all matching ninja tool pairs!</p>
            
            <div class="stats-row">
                <span id="movesDisplay">Moves: 0/8</span>
                <span id="matchesDisplay">Pairs: 0/4</span>
            </div>

            <!-- Memory Grid Arena -->
            <div id="memoryGrid" class="memory-grid">
                <!-- Cards will be injected dynamically via JS -->
            </div>

            <br>
            <a href="{{ url_for('start_learning') }}" class="back-btn">⬅ Abandon Trial</a>
        </div>
    </main>

    <!-- Completion Modal Box -->
    <div id="completionModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-badge" id="modalBadge">🏆</div>
            <h2 id="modalTitle">LEVEL COMPLETED!</h2>
            <p id="finalScoreText">Brilliant memory! You matched all pairs.</p>
            <button id="finishBtn" class="scroll-btn" style="width: 100%; margin-top: 15px;">NEXT LEVEL</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Ninjatsu Dojo Studio. Made with magic for kids!
    </footer>

    <script src="{{ url_for('static', filename='js/memory_ninja.js') }}"></script>
</body>
</html>
