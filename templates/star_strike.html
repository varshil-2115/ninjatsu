<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Strike - Pop Stars 🎯</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mali:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/start_learning.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/star_strike.css') }}">
</head>
<body>
    <header>
        <div class="logo">
            <img src="/static/image/logo.png" class="logo-ninja">
            <span class="logo-title">NINJATSU</span>
        </div>
        <nav>
            <a href="{{ url_for('homepage') }}">Home</a>
            <a href="{{ url_for('explore_games') }}">Play Games</a>
            <a href="{{ url_for('start_learning') }}" class="active">Dojo Camp</a>
            <a href="{{ url_for('rewards') }}">Trophies</a>
        </nav>
    </header>

    <main class="training-main">
        <div class="dojo-arena-box">
            <h1>STAR POPPER 🎯</h1>
            <p class="subtitle-text">Pop as many floating stars as you can!</p>
            
            <div class="stats-row">
                <span id="scoreDisplay">Stars: 0 ⭐</span>
                <span id="timerDisplay">⏱️ Time: 20s</span>
            </div>

            <div id="targetArena" class="target-arena">
                <div id="startPrompt" class="start-prompt">
                    <button id="startBtn" class="scroll-btn">GO! 🚀</button>
                </div>
            </div>

            <a href="{{ url_for('start_learning') }}" class="back-btn">⬅ Back to Dojo</a>
        </div>
    </main>

    <div id="completionModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-badge">🏆⭐</div>
            <h2>SUPER REFLEXES! 🎉</h2>
            <p id="finalScoreText">You popped all the stars and earned +50 Stars!</p>
            <button id="finishBtn" class="scroll-btn">BACK TO DOJO 🏠</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Ninjatsu Dojo Studio. Play, Learn & Have Fun! 🌟
    </footer>

    <script src="{{ url_for('static', filename='js/ninja_juice.js') }}"></script>

    <script src="{{ url_for('static', filename='js/star_strike.js') }}"></script>
</body>
</html>
