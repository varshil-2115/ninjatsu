<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Tower Race 🏁</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mali:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/word_race.css') }}">
</head>
<body>
    <header>
        <div class="logo">
            <img src="/static/image/logo.png" class="logo-ninja">
            <span class="logo-title">NINJATSU</span>
        </div>
        <nav>
            <a href="{{ url_for('homepage') }}">Home</a>
            <a href="{{ url_for('explore_games') }}">Play Games</a>
            <a href="{{ url_for('start_learning') }}" class="active">Dojo Camp</a>
            <a href="{{ url_for('rewards') }}">Trophies</a>
        </nav>
    </header>

    <main class="race-main">
        <div class="timer-box" id="timerDisplay">⏱️ 0:30</div>

        <div class="word-stack-arena" id="wordArena"></div>

        <div class="input-area">
            <input type="text" id="wordInput" placeholder="Type word here... ✏️" autofocus autocomplete="off">
        </div>

        <div class="towers-container">
            <div class="player-column col-bot1">
                <div class="avatar">🤖</div>
                <div class="name">Robo-Bot</div>
                <div class="tower-blocks" id="bot1Tower"></div>
            </div>
            <div class="player-column col-bot2">
                <div class="avatar">🦊</div>
                <div class="name">Ninja Fox</div>
                <div class="tower-blocks" id="bot2Tower"></div>
            </div>
            <div class="player-column col-player">
                <div class="avatar">👑🥷</div>
                <div class="name">YOU (HERO)</div>
                <div class="tower-blocks" id="playerTower"></div>
            </div>
            <div class="player-column col-bot3">
                <div class="avatar">🐼</div>
                <div class="name">Speedy Panda</div>
                <div class="tower-blocks" id="bot3Tower"></div>
            </div>
        </div>
    </main>

    <div id="completionModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="modalTitle">🏁 RACE FINISHED!</h2>
            <div id="finalScoreText"></div>
            <button id="finishBtn" class="scroll-btn">BACK TO DOJO 🏠</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/ninja_juice.js') }}"></script>

    <script src="{{ url_for('static', filename='js/word_race.js') }}"></script>
</body>
</html>
