<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Word Tower - Dojo Arena</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/start_learning.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/word_race.css') }}">
</head>
<body>

    <header>
        <div class="logo">🥷 NINJATSU</div>
        <nav>
            <a href="{{ url_for('homepage') }}">Home</a>
            <a href="{{ url_for('explore_games') }}">Explore Games</a>
            <a href="{{ url_for('start_learning') }}" class="active">Start Learning</a>
            <a href="{{ url_for('rewards') }}">Rewards</a>
        </nav>
    </header>

    <main class="race-main">
        <div class="timer-box" id="timerDisplay">⏱️ 0:30</div>

        <!-- Stacked Words Area -->
        <div class="word-stack-arena" id="wordArena">
            <!-- Words appear here -->
        </div>

        <!-- Input Field -->
        <div class="input-area">
            <input type="text" id="wordInput" placeholder="Type word here..." autofocus autocomplete="off">
        </div>

        <!-- Tower Stack Columns (Screenshot Style) -->
        <div class="towers-container">
            <!-- Bot 1 -->
            <div class="player-column col-bot1">
                <div class="name">GUEST 7165</div>
                <div class="avatar">🤖</div>
                <div class="tower-blocks" id="bot1Tower"></div>
            </div>
            <!-- Bot 2 -->
            <div class="player-column col-bot2">
                <div class="name">GUEST 9714</div>
                <div class="avatar">🤖</div>
                <div class="tower-blocks" id="bot2Tower"></div>
            </div>
            <!-- Player (AMI) -->
            <div class="player-column col-player">
                <div class="name">AMI</div>
                <div class="avatar">👑🥷</div>
                <div class="tower-blocks" id="playerTower"></div>
            </div>
            <!-- Bot 3 -->
            <div class="player-column col-bot3">
                <div class="name">GUEST 268</div>
                <div class="avatar">🤖</div>
                <div class="tower-blocks" id="bot3Tower"></div>
            </div>
        </div>
    </main>

    <!-- Modal Box -->
    <div id="completionModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="modalTitle">RACE FINISHED!</h2>
            <p id="finalScoreText">Great typing speed!</p>
            <button id="finishBtn" class="scroll-btn" style="width: 100%; margin-top: 15px;">RETURN TO TRAINING</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/word_race.js') }}"></script>
</body>
</html>
