<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Ninja Hero! - Join Dojo</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mali:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body class="register-page">
    <header>
        <div class="logo">
            <img src="/static/image/logo.png" class="logo-ninja">
            <span class="logo-title">NINJATSU</span>
        </div>
        <nav>
            <a href="{{ url_for('homepage') }}">Home</a>
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('register') }}" class="active">Join Us!</a>
        </nav>
    </header>

    <main class="register-main">
        <section class="hero register-card">
            <div class="hanging-ninja-wrapper">
                <img src="{{ url_for('static', filename='image/ninja2_reg (3).png') }}" alt="Hanging Ninja" class="hanging-ninja-img">
            </div>

            <div class="hero-text">
                <h1>JOIN THE <span>FUN! 🌟</span></h1>
                <p>Make your ninja hero to win belts, stars, and prizes!</p>
                
                <form class="auth-form" action="{{ url_for('register') }}" method="POST">
                    <div class="form-group">
                        <label>PICK A NINJA NAME:</label>
                        <input type="text" name="username" placeholder="e.g. StarNinja" required>
                    </div>
                    <div class="form-group">
                        <label>PARENT OR YOUR EMAIL:</label>
                        <input type="email" name="email" placeholder="name@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>YOUR AGE:</label>
                        <input type="number" name="age" placeholder="e.g. 8" min="5" max="100" required>
                    </div>
                    <div class="form-group">
                        <label>MAKE A SAFE PASSWORD:</label>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn-secondary">
                        START MY ADVENTURE! 🎉
                    </button>
                </form>
                
                <p class="switch-auth">
                    Already a ninja? <a href="{{ url_for('login') }}">Login here! ➡️</a>
                </p>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2026 Ninjatsu Dojo Studio. Play, Learn & Have Fun! 🌟
    </footer>

    <script src="{{ url_for('static', filename='js/ninja_juice.js') }}"></script>
</body>
</html>
