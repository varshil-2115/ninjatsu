<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Ninja Hero! - Join Dojo</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mali:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body class="register-page">
    <header>
        <div class="logo">
            <img src="/static/image/logo.png" class="logo-ninja">
            <span class="logo-title">NINJATSU</span>
        </div>
        <nav>
            <a href="{{ url_for('homepage') }}">Home</a>
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('register') }}" class="active">Join Us!</a>
        </nav>
    </header>

    <main class="register-main">
        <section class="hero register-card">
            <div class="hanging-ninja-wrapper">
                <img src="{{ url_for('static', filename='image/ninja2_reg (3).png') }}" alt="Hanging Ninja" class="hanging-ninja-img">
            </div>

            <div class="hero-text">
                <h1>JOIN THE <span>FUN! 🌟</span></h1>
                <p>Make your ninja hero to win belts, stars, and prizes!</p>

                <div class="oauth-divider" style="display: flex; align-items: center; margin: 20px 0; color: #94a3b8; font-weight: 600; font-size: 13px;">
    <span style="flex: 1; height: 1px; background: #e2e8f0;"></span>
    <span style="padding: 0 12px;">OR CONTINUE WITH</span>
    <span style="flex: 1; height: 1px; background: #e2e8f0;"></span>
</div>

<a href="{{ url_for('google_login') }}" class="btn-google-login" style="display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 12px 18px; border-radius: 50px; border: 2px solid #cbd5e1; background: #ffffff; color: #1e293b; text-decoration: none; font-weight: 700; font-size: 15px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06); transition: all 0.2s ease;">
    <svg style="width: 20px; height: 20px;" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>
    <span>Sign in with Google</span>
</a>
                
                <form class="auth-form" action="{{ url_for('register') }}" method="POST">
                    <div class="form-group">
                        <label>PICK A NINJA NAME:</label>
                        <input type="text" name="username" placeholder="e.g. StarNinja" required>
                    </div>
                    <div class="form-group">
                        <label>PARENT OR YOUR EMAIL:</label>
                        <input type="email" name="email" placeholder="name@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>YOUR AGE:</label>
                        <input type="number" name="age" placeholder="e.g. 8" min="5" max="100" required>
                    </div>
                    <div class="form-group">
                        <label>MAKE A SAFE PASSWORD:</label>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>
                    
                    
                    <button type="submit" class="btn-secondary">
                        START MY ADVENTURE! 🎉
                    </button>
                </form>
                
                <p class="switch-auth">
                    Already a ninja? <a href="{{ url_for('login') }}">Login here! ➡️</a>
                </p>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2026 Ninjatsu Dojo Studio. Play, Learn & Have Fun! 🌟
    </footer>

    <script src="{{ url_for('static', filename='js/ninja_juice.js') }}"></script>
</body>
</html>
